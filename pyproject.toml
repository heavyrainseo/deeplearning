[project]
name = "deeplearning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prof. Seo", email = "hvyrain@ysc.ac.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "keras>=3.15.1",
    "koreanize-matplotlib>=0.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "setuptools>=84.0.0",
    "tensorflow>=2.22.0rc0",
]

[project.scripts]
